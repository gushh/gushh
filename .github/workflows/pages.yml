name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar el pixel art
        run: |
          pip install fonttools
          python art/build.py
          python art/webfont.py
          git diff --quiet -- assets || echo "::warning::Los SVG de assets/ no coinciden con art/build.py. Corré 'python3 art/build.py' y commiteá el resultado."

      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r assets _site/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
